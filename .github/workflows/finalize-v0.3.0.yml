name: Finalize v0.3.0

on:
  push:
    paths:
      - ".github/finalize-v0.3.0.trigger"

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Move release tag to clean validated commit
        env:
          CLEAN_SHA: 1f405a08ecd69f17acff00c1cd38ecf1a3f4b225
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f v0.3.0 "$CLEAN_SHA"
          git push --force origin refs/tags/v0.3.0
          cat > /tmp/release-notes.md <<'EOF'
          First public release.

          - Dynamic Smoobu accommodation mapping
          - Laundry approval workflow
          - NUKI guest-code workflow
          - Booking calendars and status sensors
          - Optional IT.NRW statistics
          - Installation-specific IDs, email addresses, notify services and SMTP defaults removed from the public codebase

          See CHANGELOG.md and MIGRATION.md for details.
          EOF
          gh release edit v0.3.0 --target "$CLEAN_SHA" --title "Smoobu Workflow v0.3.0" --notes-file /tmp/release-notes.md
      - name: Build source archive from release tag
        run: |
          git archive --format=zip --output=/tmp/ha-smoobu-mittelhof-v0.3.0.zip v0.3.0
          sha256sum /tmp/ha-smoobu-mittelhof-v0.3.0.zip | tee /tmp/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ha-smoobu-mittelhof-v0.3.0-final
          path: |
            /tmp/ha-smoobu-mittelhof-v0.3.0.zip
            /tmp/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
