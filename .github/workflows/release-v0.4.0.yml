name: Release v0.4.0

on:
  push:
    paths:
      - ".github/release-v0.4.0.trigger"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish v0.4.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.0 >/dev/null 2>&1; then
            echo "v0.4.0 already exists"
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## Wäschebestand / Sets

          - Neuer auswählbarer Wäschemodus **Lagerbestand / Sets**; der bisherige Modus **Pro Abreise bestellen** bleibt unverändert erhalten.
          - Startbestand: **24 vollständige Sets**.
          - Nachbestellung ab **12 verbrauchten Sets**.
          - Nachbestellung: **12 vollständige Sets + 3 Badvorleger**.
          - Vorschlag aus Smoobu: **1–2 Gäste = 2 Sets**, **3+ Gäste = 4 Sets**.
          - Die Reinigungskraft bestätigt den tatsächlichen Verbrauch über die neue Home-Assistant-Action `smoobu_mittelhof.record_laundry_consumption`.
          - Die zuletzt bestätigte Erfassung kann bis zur nächsten versendeten Nachbestellung korrigiert werden.
          - Persistente Bestands-/Diagnosedaten und CI-Test für die Bestandsrechnung.
          EOF
          gh release create v0.4.0             --target 9566b8effcd6335886a4f618182e153b0b9ba53b             --title "Smoobu Workflow v0.4.0"             --notes-file /tmp/release-notes.md
