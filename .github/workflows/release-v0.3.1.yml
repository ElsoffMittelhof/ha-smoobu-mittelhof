name: Release v0.3.1

on:
  push:
    paths:
      - ".github/release-v0.3.1.trigger"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/smoobu_mittelhof/manifest.json').read_text())
          assert manifest['version'] == '0.3.1', manifest['version']
          PY
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.1 >/dev/null 2>&1; then
            echo "Release v0.3.1 already exists."
            exit 0
          fi
          gh release create v0.3.1 \
            --target "$RELEASE_TARGET" \
            --title "Smoobu Workflow v0.3.1" \
            --notes "Blocked periods are now shown in the Smoobu occupancy timeline.\n\n- Timeline fetches blocked periods from Smoobu\n- Blocked periods are displayed as hatched bars labelled 'Geblockt'\n- Legend and details distinguish blocked periods from reservations\n- Laundry and NUKI workflow logic remains unchanged\n\nSee CHANGELOG.md for details."
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TARGET: "__VALIDATED_SHA__"
