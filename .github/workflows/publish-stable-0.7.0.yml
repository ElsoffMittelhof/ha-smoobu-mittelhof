name: Publish Smoobu 0.7.0 STABLE production-safe integration

on:
  push:
    branches:
      - publish/0.7.0

permissions:
  contents: write

concurrency:
  group: smoobu-publish-0.7.0
  cancel-in-progress: false

jobs:
  build-verify-publish:
    if: github.repository == 'ElsoffMittelhof/ha-smoobu-mittelhof'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch release packaging workflow
        uses: actions/checkout@v4
        with:
          path: publisher
      - name: Fetch frozen, production-upgrade-verified source
        uses: actions/checkout@v4
        with:
          ref: 853acc9ac20e4f6a34717624e6eecb7441e098c5
          path: source
          persist-credentials: false
      - name: Verify frozen source SHA
        run: |
          test "$(git -C source rev-parse HEAD)" = "853acc9ac20e4f6a34717624e6eecb7441e098c5"
          python - <<'PY'
          import json
          from pathlib import Path
          m = json.loads(Path("source/custom_components/smoobu_mittelhof/manifest.json").read_text())
          assert m["version"] == "0.7.0" and m["domain"] == "smoobu_mittelhof"
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Repeat critical regression tests on released exact source
        working-directory: source
        run: |
          python -m compileall -q custom_components/smoobu_mittelhof
          python tests/test_guest_finance.py
          python tests/test_invoice_numbers.py
          python tests/test_guest_api_contract.py
          python tests/test_laundry_stock.py
          python tests/test_isolated_workflows.py
          python tests/test_statistics.py
          python tests/test_production_upgrade.py
          node --check custom_components/smoobu_mittelhof/frontend/mittelhof-guest-card.js
          node --check custom_components/smoobu_mittelhof/frontend/mittelhof-laundry-card.js
          node --check custom_components/smoobu_mittelhof/frontend/smoobu-timeline-card.js
      - name: Create reproducible manual HA installation archive
        run: python publisher/.github/scripts/package_production_070.py source dist
      - name: Keep install ZIP and SHA verification as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: smoobu-mittelhof-release-0.7.0
          path: |
            dist/smoobu-mittelhof-0.7.0.zip
            dist/SHA256SUMS.txt
          retention-days: 30
          if-no-files-found: error
      - name: Publish stable GitHub integration RELEASE (mark latest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=v0.7.0
          if gh release view "$TAG" --repo ElsoffMittelhof/ha-smoobu-mittelhof >/dev/null 2>&1; then
            echo "Release $TAG already exists. Never overwrite immutable release assets."
          else
            gh release create "$TAG" \
              dist/smoobu-mittelhof-0.7.0.zip \
              dist/SHA256SUMS.txt \
              --repo ElsoffMittelhof/ha-smoobu-mittelhof \
              --target 853acc9ac20e4f6a34717624e6eecb7441e098c5 \
              --title "Smoobu Workflow 0.7.0 – Home Assistant Integration (Gäste opt-in)" \
              --notes-file publisher/.github/RELEASE_NOTES_v0.7.0.md \
              --latest=true
          fi
          gh release view "$TAG" --repo ElsoffMittelhof/ha-smoobu-mittelhof --json url,tagName,isPrerelease
