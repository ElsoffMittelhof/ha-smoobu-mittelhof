name: Validate

on:
  push:
  pull_request:

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile Python sources
        run: python -m compileall -q custom_components/smoobu_mittelhof
      - name: Test laundry stock accounting
        run: python tests/test_laundry_stock.py
      - name: Test separate NUKI and laundry check actions
        run: python tests/test_isolated_workflows.py
      - name: Test IT.NRW statistics month boundaries
        run: python tests/test_statistics.py
      - name: Test guest invoice draft revisions and payment handling
        run: python tests/test_guest_finance.py
      - name: Test Smoobu guest API contract offline
        run: python tests/test_guest_api_contract.py
      - name: Test exact house and arrival invoice number previews
        run: python tests/test_invoice_numbers.py
      - name: Test production 0.6.8 upgrade compatibility and strict opt-in defaults
        run: python tests/test_production_upgrade.py
      - name: Test Smoobu screenshot price/country import
        run: python tests/test_smoobu_sources.py
      - name: Test guest center separation and inbox/archive contracts
        run: python tests/test_guest_center_contract.py
      - name: Test accounting PDF, tax validation and booking-ledger contract
        run: python tests/test_accounting_pdf.py

  frontend-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check timeline card JavaScript
        run: node --check custom_components/smoobu_mittelhof/frontend/smoobu-timeline-card.js
      - name: Check laundry card JavaScript
        run: node --check custom_components/smoobu_mittelhof/frontend/mittelhof-laundry-card.js
      - name: Check guest card JavaScript
        run: node --check custom_components/smoobu_mittelhof/frontend/mittelhof-guest-card.js
      - name: Check accounting card JavaScript
        run: node --check custom_components/smoobu_mittelhof/frontend/mittelhof-accounting-card.js

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands topics
