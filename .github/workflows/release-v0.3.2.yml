name: Release v0.3.2

on:
  push:
    paths:
      - ".github/release-v0.3.2.trigger"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/smoobu_mittelhof/manifest.json').read_text())
          assert manifest['version'] == '0.3.2', manifest['version']
          PY
      - name: Clean release helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/patch-v0.3.2-halfday.yml
          rm -f .github/patch-v0.3.2-halfday.trigger
          rm -f .github/workflows/release-v0.3.2.yml
          rm -f .github/release-v0.3.2.trigger
          git add -A
          git commit -m "chore: finalize v0.3.2 release"
          git push
          echo "RELEASE_TARGET=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.3.2 >/dev/null 2>&1; then
            echo "Release v0.3.2 already exists."
            exit 0
          fi
          gh release create v0.3.2 \
            --target "$RELEASE_TARGET" \
            --title "Smoobu Workflow v0.3.2" \
            --notes "Timeline booking and blocked-period bars now use half-day boundaries. Arrival and departure dates are displayed at midday, so a reservation ending on 03.10. ends at the middle of that date and a block from 03.10. to 04.10. runs from midday to midday. Laundry and NUKI workflow logic remains unchanged."
