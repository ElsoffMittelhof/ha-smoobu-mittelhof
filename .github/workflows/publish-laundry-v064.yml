name: Publish Smoobu Workflow v0.6.4

on:
  push:
    branches: [main]
    paths: [".github/workflows/publish-laundry-v064.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Validate guest-name and zero-consumption portal integration
        run: |
          set -euo pipefail
          grep -q '"version": "0.6.4"' custom_components/smoobu_mittelhof/manifest.json
          python -m compileall -q custom_components/smoobu_mittelhof
          python tests/test_laundry_stock.py
          python tests/test_statistics.py
          node --check custom_components/smoobu_mittelhof/frontend/mittelhof-laundry-card.js
      - name: Publish HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.6.4 >/dev/null 2>&1; then
            echo "Release already exists"
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          s=Path("CHANGELOG.md").read_text(encoding="utf-8")
          notes=s.split("## 0.6.4",1)[1].split("## 0.6.3",1)[0].strip()
          Path("release-notes-v0.6.4.md").write_text(notes+"\n",encoding="utf-8")
          PY
          gh release create v0.6.4 --title "Smoobu Workflow 0.6.4 – Gastnamen und Null-Wechsel" --notes-file release-notes-v0.6.4.md --target "$GITHUB_SHA"
