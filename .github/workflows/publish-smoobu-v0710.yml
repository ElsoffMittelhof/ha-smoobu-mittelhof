name: Publish Smoobu Workflow v0.7.10

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-smoobu-v0710.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile and execute complete existing regression suite
        run: |
          set -euo pipefail
          python -m compileall -q custom_components/smoobu_mittelhof
          for f in tests/test_*.py; do python "$f"; done
          python - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path("custom_components/smoobu_mittelhof/manifest.json").read_text())["version"] == "0.7.10"
          PY

  frontend-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate all frontend modules
        run: |
          set -euo pipefail
          for f in custom_components/smoobu_mittelhof/frontend/*.js; do node --check "$f"; done
          node tests/test_accounting_date_ui.js
          node tests/test_accounting_vat_error_ui.js
          node tests/test_accounting_404_ui.js

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands topics

  release:
    needs: [python-regression, frontend-regression, hassfest, hacs]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bundle installation ZIP and reproducible checksum
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          from hashlib import sha256
          root = Path("custom_components/smoobu_mittelhof")
          out = Path("smoobu-mittelhof-0.7.10.zip")
          files = sorted(p for p in root.rglob("*") if p.is_file() and "__pycache__" not in p.parts and p.suffix != ".pyc")
          assert files
          with ZipFile(out, "w", compression=ZIP_DEFLATED) as z:
              for path in files:
                  z.write(path, path.as_posix())
          digest = sha256(out.read_bytes()).hexdigest()
          Path("SHA256SUMS.txt").write_text(f"{digest}  {out.name}\n", encoding="utf-8")
          with ZipFile(out) as z:
              assert z.testzip() is None
              assert "custom_components/smoobu_mittelhof/manifest.json" in z.namelist()
          PY
      - name: Publish immutable stable HACS release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v0.7.10 >/dev/null 2>&1; then
            echo "v0.7.10 already exists; refusing to replace published assets"
            exit 1
          fi
          gh release create v0.7.10 \
            --title "Smoobu Workflow 0.7.10 – Mittelhof Zahlungsziel-Regeln für Belege und Rechnungsentwürfe" \
            --notes-file docs/release-0.7.10-production.md \
            --target "$GITHUB_SHA" \
            smoobu-mittelhof-0.7.10.zip SHA256SUMS.txt
