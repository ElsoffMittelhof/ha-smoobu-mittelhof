name: Release v0.4.1

on:
  push:
    paths:
      - ".github/release-v0.4.1.trigger"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish v0.4.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v0.4.1 >/dev/null 2>&1; then
            echo "v0.4.1 already exists"
            exit 0
          fi
          cat > /tmp/release-notes.md <<'EOF'
          ## IT.NRW Monatsgrenze korrigiert

          - Die Statistik verwendet jetzt standardmäßig den echten Kalendermonat.
          - Eine Buchung 27.09.–02.10. zählt die Nacht 01.10.→02.10. korrekt im Oktober.
          - Bei zwei Gästen ergeben sich dafür im Oktober 2 Übernachtungen und 0 Ankünfte.
          - Die ausgewählte Monatsstatistik und der Statistik-Button verwenden jetzt `calendar_month`.
          - `node_red_compatible` bleibt nur als expliziter Legacy-Modus erhalten.
          - Regressionstest für monatsübergreifende Aufenthalte ergänzt.
          EOF
          gh release create v0.4.1             --target f31802a7f1baa6838853c0ba77733f0e5ce9c2bd             --title "Smoobu Workflow v0.4.1"             --notes-file /tmp/release-notes.md
