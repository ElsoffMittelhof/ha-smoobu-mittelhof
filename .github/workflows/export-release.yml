name: Export v0.3.0 archive

on:
  push:
    paths:
      - ".github/export-v0.3.0.trigger"

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: v0.3.0
          fetch-depth: 0
      - name: Verify release version
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('custom_components/smoobu_mittelhof/manifest.json').read_text())
          assert manifest['version'] == '0.3.0', manifest['version']
          PY
      - name: Build exact release source zip
        run: |
          zip -qr /tmp/ha-smoobu-mittelhof-v0.3.0.zip . -x '.git/*'
          sha256sum /tmp/ha-smoobu-mittelhof-v0.3.0.zip | tee /tmp/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: ha-smoobu-mittelhof-v0.3.0
          path: |
            /tmp/ha-smoobu-mittelhof-v0.3.0.zip
            /tmp/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
