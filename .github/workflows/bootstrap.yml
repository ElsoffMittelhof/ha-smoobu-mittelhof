name: Bootstrap repository

on:
  push:
    paths:
      - "payload/data11"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and expand sanitized repository payload
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, io, tarfile

          bootstrap = ''.join((Path('bootstrap') / f'part{i:02d}').read_text() for i in range(7))
          marker = 'DATA = """'
          if marker not in bootstrap:
              raise SystemExit('Bootstrap DATA marker not found')
          prefix = bootstrap.split(marker, 1)[1]

          payload = ''.join((Path('payload') / f'data{i:02d}').read_text() for i in range(10))
          alphabet = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='

          recovered = None
          for offset in (-2, -1, 0, 1, 2):
              start = len(prefix) + offset
              if start < 0 or start > len(payload):
                  continue
              base = prefix + payload[start:]
              for suffix in ['', *alphabet]:
                  candidate = base + suffix
                  try:
                      raw = base64.b64decode(candidate, validate=True)
                      with tarfile.open(fileobj=io.BytesIO(raw), mode='r:gz') as tf:
                          tf.getmembers()
                  except Exception:
                      continue
                  recovered = raw
                  print(f'Recovered payload with offset={offset!r}, suffix={suffix!r}')
                  break
              if recovered is not None:
                  break

          if recovered is None:
              raise SystemExit('Could not recover payload')

          Path('payload.tar.gz').write_bytes(recovered)
          PY
          tar -xzf payload.tar.gz
          rm -rf payload bootstrap payload.tar.gz .github/workflows/bootstrap.yml RELEASE_READY TEST_FINAL_STATE_PROBE
      - name: Commit final public tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare public v0.3.0"
          git push
