name: Bootstrap repository

on:
  push:
    paths:
      - "bootstrap/part07"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reassemble sanitized repository bootstrap
        run: cat bootstrap/part* > bootstrap.py
      - name: Expand sanitized repository
        run: python bootstrap.py
      - name: Commit final public tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare public v0.3.0"
          git push
