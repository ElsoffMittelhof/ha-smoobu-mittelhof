name: Bootstrap repository

on:
  push:
    paths:
      - "payload/data11"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand sanitized repository payload
        run: |
          cat payload/data00 payload/data01 payload/data02 payload/data03 payload/data04 payload/data05 payload/data06 payload/data07 payload/data08 payload/data09 > payload.partial
          alphabet='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/='
          found=0
          for ((i=0; i<${#alphabet}; i++)); do
            c="${alphabet:i:1}"
            printf '%s' "$c" > payload.tail
            cat payload.partial payload.tail > payload.b64
            if base64 --decode payload.b64 > payload.tar.gz 2>/dev/null && tar -tzf payload.tar.gz >/dev/null 2>&1; then
              echo "Recovered final Base64 character."
              found=1
              break
            fi
          done
          test "$found" -eq 1
          tar -xzf payload.tar.gz
          rm -rf payload bootstrap payload.partial payload.tail payload.b64 payload.tar.gz .github/workflows/bootstrap.yml RELEASE_READY TEST_FINAL_STATE_PROBE
      - name: Commit final public tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare public v0.3.0"
          git push
