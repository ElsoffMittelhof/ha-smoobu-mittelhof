name: Bootstrap repository

on:
  push:
    paths:
      - "payload/data11"

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Expand sanitized repository payload
        run: |
          cat payload/data* > payload.b64
          base64 --decode payload.b64 > payload.tar.gz
          tar -xzf payload.tar.gz
          rm -rf payload bootstrap payload.b64 payload.tar.gz .github/workflows/bootstrap.yml
      - name: Commit final public tree
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "release: prepare public v0.3.0"
          git push
