get_bookings:
  name: Buchungen abrufen
  description: Liefert Smoobu-Buchungen für einen beliebigen Zeitraum als Response-Daten.
  fields:
    start_date:
      required: true
      selector:
        date:
    end_date:
      required: true
      selector:
        date:
    apartment_id:
      required: false
      selector:
        number:
          min: 1
          mode: box

generate_it_nrw_statistics:
  name: IT.NRW Statistik erzeugen
  description: Berechnet die Monatsstatistik und speichert das Ergebnis im Statistik-Sensor.
  fields:
    year:
      required: true
      selector:
        number:
          min: 2000
          max: 2100
          mode: box
    month:
      required: true
      selector:
        number:
          min: 1
          max: 12
          mode: box
    mode:
      required: false
      default: calendar_month
      selector:
        select:
          options:
            - calendar_month
            - node_red_compatible


generate_selected_it_nrw_statistics:
  name: Ausgewählte IT.NRW Statistik erstellen
  description: Erzeugt die Statistik sofort für den in Monat und Jahr ausgewählten Zeitraum.

preview_template:
  name: E-Mail-Template Vorschau
  description: Rendert eine externe YAML-Mailvorlage mit echten Smoobu-Platzhaltern, versendet aber keine E-Mail.
  fields:
    booking_id:
      required: true
      selector:
        text:
    template:
      required: true
      example: nuki_de
      selector:
        text:

calculate_laundry:
  name: Wäschebedarf berechnen
  description: Berechnet Mengen und Kosten aus dem externen Produktkatalog und den Hausprofilen.
  fields:
    apartment_ids:
      required: true
      selector:
        object:

reload_files:
  name: Externe Dateien prüfen
  description: Prüft die externe Wäschereikonfiguration. Templates werden bei jeder Verwendung neu geladen.

process_workflows:
  name: Wäsche + NUKI jetzt prüfen
  description: Führt die vollständige Wäsche- und NUKI-Prozesslogik sofort aus.
  fields:
    force_laundry_notify:
      required: false
      default: false
      selector:
        boolean:
    force_nuki_notify:
      required: false
      default: false
      selector:
        boolean:

laundry_command:
  name: Wäsche Freigabe ausführen
  description: Führt die aktuelle Wäsche-Freigabe aus. Ohne Request-ID wird der jüngste offene Request verwendet.
  fields:
    command:
      required: true
      selector:
        select:
          options:
            - send
            - later
            - skip
    request_id:
      required: false
      selector:
        text:

record_laundry_consumption:
  name: Wäscheverbrauch erfassen
  description: Erfasst Sets (5 Teile je Set), zusätzliche Einzelartikel und Badvorleger für eine Reinigung; vorhandene Buchungen können vor Wareneingang korrigiert werden.
  fields:
    apartment_id:
      required: true
      selector:
        number:
          min: 1
          mode: box
    sets:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 8
          step: 1
          mode: box
    mats:
      required: false
      default: 0
      description: Anzahl separat verbrauchter Badvorleger (0–6).
      selector:
        number:
          min: 0
          max: 6
          step: 1
          mode: box
    items:
      required: false
      description: "Zusätzliche Einzelmengen, z.B. {pillowcase: 1, towel: 2}. Werden zu den angegebenen Sets addiert."
      selector:
        object:
    booking_id:
      required: false
      description: Optional für gezielte Korrekturen; ohne Angabe wird die älteste offene Verbrauchserfassung der Unterkunft verwendet.
      selector:
        text:

nuki_command:
  name: NUKI Freigabe ausführen
  description: Führt die aktuelle NUKI-Freigabe aus. Ohne Request-ID wird der jüngste offene Request verwendet.
  fields:
    command:
      required: true
      selector:
        select:
          options:
            - send
            - later
            - skip
    request_id:
      required: false
      selector:
        text:

send_test_email:
  name: SMTP Testmail senden
  description: Sendet eine Testmail über die in der Integration konfigurierten SMTP-Zugangsdaten.
  fields:
    to:
      required: true
      selector:
        text:

reset_laundry:
  name: Wäsche offene Status zurücksetzen
  description: Setzt nur offene/ignorierte/fehlerhafte Wäschevorgänge zurück. Bereits versendete Bestellungen bleiben geschützt.

reset_nuki:
  name: NUKI offene Status zurücksetzen
  description: Setzt nur offene/ignorierte/fehlerhafte NUKI-Vorgänge zurück. Bereits versendete Gastmails bleiben geschützt.

reset_all_workflow_state:
  name: Gesamten Workflow-Testzustand zurücksetzen
  description: Löscht Wäsche- und NUKI-Workflowzustände inklusive bereits versendet. Nur für Migration und Tests verwenden.
  fields:
    process_now:
      required: false
      default: false
      selector:
        boolean:

send_test_notification:
  name: Test-Push senden
  description: Sendet eine Test-Benachrichtigung über den in der Integration eingestellten Notify-Service.

reconcile_laundry_stock:
  name: Wäschebestand nach Inventur korrigieren
  description: Setzt den tatsächlich gezählten verfügbaren Bestand von Sets und Badvorlegern explizit. Historische Buchungen bleiben erhalten. Nicht zum Testen ausführen.
  fields:
    sets:
      required: true
      selector:
        number:
          min: 0
          max: 500
          mode: box
    mats:
      required: true
      selector:
        number:
          min: 0
          max: 500
          mode: box

reconcile_laundry_items:
  name: Alle Wäscheartikel nach Inventur korrigieren
  description: Ersetzt die sechs verfügbaren Artikelbestände nach körperlicher Zählung. Verändert keine historischen Aufträge. Nicht für Tests ausführen.
  fields:
    items:
      required: true
      description: 'Alle sechs Artikel angeben: pillowcase, flat_sheet, fitted_sheet, bath_towel, towel, bath_mat.'
      selector:
        object:

receive_laundry_delivery:
  name: Wäschereilieferung tatsächlich einbuchen
  description: Bucht ausschließlich bestätigte gelieferte Artikel einer noch offenen Bestellung, auch Teillieferungen. Keine Gutschrift beim E-Mail-Versand.
  fields:
    request_id:
      required: true
      selector:
        text:
    items:
      required: true
      description: 'Tatsächlich eingetroffene Einzelmengen, z.B. {towel: 4, bath_mat: 2}.'
      selector:
        object:

record_clean_laundry_receipt:
  name: Zugang sauberer Wäsche verbuchen
  description: Addiert tatsächlich eingetroffene saubere Artikel ohne Bestellreferenz. Schmutzwäsche zählt nicht als verfügbar. Eine eindeutige Portal-Beleg-ID verhindert doppelte Buchungen.
  fields:
    receipt_id:
      required: true
      description: 'Idempotente Portal-Beleg-ID, z.B. portal_123.'
      selector:
        text:
    items:
      required: true
      description: 'Alle sechs Mengen als Objekt, z.B. {pillowcase: 2, flat_sheet: 2, fitted_sheet: 2, bath_towel: 2, towel: 2, bath_mat: 0}.'
      selector:
        object:

sync_portal_laundry_stock:
  name: Portal-Wäschebestand als Replikat synchronisieren
  description: Setzt den HA-Anzeigebestand aus der führenden Portal-Datenbank anhand monotoner Revisionen. Buchungs- und Lieferereignisse markieren nur den Workflowstatus, der Bestand wird nicht erneut verändert.
  fields:
    revision:
      required: true
      selector:
        number:
          min: 1
          mode: box
    items:
      required: true
      selector:
        object:
    events:
      required: true
      description: Bestätigte Portal-Buchungs- und Lieferereignisse seit dem letzten bestätigten Cursor.
      selector:
        object:
